[package]
name = "pandark-napi"
version.workspace = true
authors.workspace = true
description = "Node-API bindings for Pandark crawl orchestration"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
pandark-core = { workspace = true }
pandark-fetch = { workspace = true }
pandark-types = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "pandark"
