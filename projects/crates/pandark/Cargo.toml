[package]
name = "pandark"
version.workspace = true
authors.workspace = true
description = "Pandark crawl orchestration and native Rust facade"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
blake3 = { workspace = true }
acorn-codec = { workspace = true }
boost-diagnostic = { workspace = true }
notedown-ir = { workspace = true }
notedown-formats = { workspace = true }
pandark-types = { workspace = true }
pandark-extract = { workspace = true }
pandark-fetch = { workspace = true }
pandark-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
boost-http = { workspace = true }
oak-xml = { workspace = true }

[dev-dependencies]
boost-log = { workspace = true }
serial_test = "3"

[features]
default = []
logger = ["pandark-fetch/logger"]
yydb = ["pandark-store/yydb"]
