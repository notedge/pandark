[package]
name = "pandark"
version.workspace = true
authors.workspace = true
description = "Pandark crawl orchestration and native Rust facade"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
blake3 = { workspace = true }
flate2 = { workspace = true }
notedown-ir = { workspace = true }
notedown-formats = { workspace = true }
pandark-types = { workspace = true }
pandark-extract = { workspace = true }
pandark-fetch = { workspace = true }
pandark-store = { path = "../pandark-store", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
boost-http = { workspace = true }
oak-xml = { workspace = true }
oak-core = { workspace = true, optional = true }
oak-html = { workspace = true, optional = true }

[dev-dependencies]
boost-log = { workspace = true }
serial_test = "3"

[[example]]
name = "tree_dump"
required-features = ["oak-debug"]

[features]
default = []
logger = ["pandark-fetch/logger"]
yydb = ["pandark-store/yydb"]
oak-debug = ["dep:oak-core", "dep:oak-html"]
