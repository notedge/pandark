[package]
name = "pandark"
version.workspace = true
authors.workspace = true
description = "Pandark crawl orchestration, fetch transport, and Node-API bindings"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
notedown-ir = { workspace = true }
pandark-types = { workspace = true }
pandark-store = { workspace = true, features = ["yydb"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
ureq = { version = "2.12", default-features = true }

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "pandark"
