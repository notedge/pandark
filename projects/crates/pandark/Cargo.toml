[package]
name = "pandark"
version.workspace = true
authors.workspace = true
description = "Pandark crawl orchestration and native Rust facade"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
notedown-ir = { workspace = true }
pandark-types = { workspace = true }
pandark-extract = { workspace = true }
pandark-fetch = { workspace = true }
pandark-store = { workspace = true, features = ["yydb"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
ureq = { version = "2.12", default-features = true }

[features]
default = []
logger = ["pandark-fetch/logger"]
