[package]
name = "pandark-fetch"
version.workspace = true
authors.workspace = true
description = "Pandark fetch transports, robots policy, and response caching"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
pandark-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
boost-http = { workspace = true }
boost-log = { workspace = true, optional = true }

[features]
default = []
logger = ["dep:boost-log"]

[[test]]
name = "g_arch_fetch_replace_transport"
path = "tests/g_arch_fetch_replace_transport.rs"
