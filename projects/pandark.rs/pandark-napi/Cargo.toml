[package]
name = "pandark-napi"
version.workspace = true
authors.workspace = true
description = "Node-API adapter for Pandark"
readme = "readme.md"
homepage = "https://github.com/notedge/pandark"
repository = "https://github.com/notedge/pandark"
license.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# The binding can only be exercised inside a `node` host: the Node-API symbols
# are resolved by the runtime, so a Rust test binary that linked this crate
# would fail with undefined `napi_*` symbols on Linux and macOS.
test = false
doctest = false

[dependencies]
document-formats = { workspace = true }
crawler = { workspace = true }
crawler-fetch = { workspace = true }
crawler-types = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "pandark"

[[test]]
name = "g_arch_napi_standalone_build"
path = "tests/g_arch_napi_standalone_build.rs"
