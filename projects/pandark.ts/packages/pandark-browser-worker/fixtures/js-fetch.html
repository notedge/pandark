<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>JS 请求骨架页面</title>
</head>
<body>
    <main>
        <div id="mount">加载中</div>
    </main>
    <script>
        (async () => {
            const response = await fetch("/quotes.json");
            const payload = await response.json();
            document.title = "JS 渲染列表样本";
            const items = payload.quotes
                .map((quote) => "<li>" + quote.text + " —— " + quote.author + "</li>")
                .join("");
            document.getElementById("mount").innerHTML =
                "<article>" +
                "<h1>JS 渲染列表样本</h1>" +
                "<p>列表正文标记：fetch 返回后才会出现。</p>" +
                "<ul>" + items + "</ul>" +
                "</article>";
        })();
    </script>
</body>
</html>
