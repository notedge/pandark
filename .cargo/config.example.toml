# Copy to `config.toml` (git ignored) and replace `<your-path>` with your local absolute path.
# Committed `Cargo.toml` uses git `branch = "dev"` with `rev` pins where listed.

[patch."https://github.com/notedge/notedown.git"]
notedown-ir = { path = "<your-path>/notedown/projects/crates/notedown-ir" }
notedown-formats = { path = "<your-path>/notedown/projects/crates/notedown-formats" }

[patch."https://github.com/yggdrasil-language/oak.rs.git"]
oak-core = { path = "<your-path>/oaks/projects/oak-core" }
oak-markdown = { path = "<your-path>/oaks/examples/oak-markdown" }
oak-html = { path = "<your-path>/oaks/examples/oak-html" }
oak-xml = { path = "<your-path>/oaks/examples/oak-xml" }
oak-xpath = { path = "<your-path>/oaks/examples/oak-xpath" }
oak-css-selector = { path = "<your-path>/oaks/examples/oak-css-selector" }

[patch."https://github.com/oovm/rust-boost"]
boost-diagnostic = { path = "<your-path>/rust-boost/projects/boost-diagnostic" }
boost-log = { path = "<your-path>/rust-boost/projects/boost-log" }
boost-http = { path = "<your-path>/rust-boost/projects/boost-http" }
