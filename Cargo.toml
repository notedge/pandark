[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = [
    "projects/crates/pandark",
    "projects/crates/pandark-types",
    "projects/crates/pandark-fetch",
    "projects/crates/pandark-extract",
    "projects/crates/pandark-store",
]

[workspace.package]
version = "0.0.12"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "465e3e5eb263f1d2b6f7429c426c5e78064182bc", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "465e3e5eb263f1d2b6f7429c426c5e78064182bc" }
boost-http = { git = "https://github.com/oovm/rust-boost", rev = "465e3e5eb263f1d2b6f7429c426c5e78064182bc" }
boost-random = { git = "https://github.com/oovm/rust-boost", rev = "465e3e5eb263f1d2b6f7429c426c5e78064182bc", default-features = false, features = ["system"] }
# Overlaid by local path `.cargo/config.toml` (git ignored).
oak-xml = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "5ad929047783b8750191b3d8dc25a94bd88681e4", default-features = false }
# Compression codec (production path; replaces flate2).
acorn-codec = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996", default-features = false, features = ["compression"] }
# Overlaid by local path `.cargo/config.toml` (git ignored).
notedown-ir = { git = "https://github.com/notedge/notedown.git", rev = "0b6241dbd5713890d0adb171ef4a57638719d3da" }
notedown-formats = { git = "https://github.com/notedge/notedown.git", rev = "0b6241dbd5713890d0adb171ef4a57638719d3da", default-features = false, features = ["markdown", "html"] }
# Overlaid by local path `.cargo/config.toml` (git ignored).
yydb = { git = "https://github.com/yy-database/yydb.rs", rev = "f7eaf8ecfdb1cbaf6089a4b560caffa0c2acabeb" }
# Local dependencies
pandark-types = { path = "projects/crates/pandark-types" }
pandark-fetch = { path = "projects/crates/pandark-fetch" }
pandark-extract = { path = "projects/crates/pandark-extract" }
pandark-store = { path = "projects/crates/pandark-store", default-features = false }
pandark = { path = "projects/crates/pandark" }
pandark-napi = { path = "projects/crates/pandark-napi" }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = { version = "2.5.8", features = ["serde"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
blake3 = "1.8.7"

[profile.release]
lto = true
opt-level = "s"

# Patch transitive git deps that use branch="dev" and have drifted upstream.
# yydb → vos-language?branch=dev (HEAD removed oak-vos)
# vos-language → dejavu-engine?branch=dev
# Forked to notedge org and pinned to known-good revs.
[patch."https://github.com/voml/vos-language.git"]
vos = { git = "https://github.com/notedge/vos-language.git", rev = "39cb1a36a9e1e08b237362257b8db6e47e036fe6" }
vos-format = { git = "https://github.com/notedge/vos-language.git", rev = "39cb1a36a9e1e08b237362257b8db6e47e036fe6" }
vos-generator = { git = "https://github.com/notedge/vos-language.git", rev = "39cb1a36a9e1e08b237362257b8db6e47e036fe6" }
vos-types = { git = "https://github.com/notedge/vos-language.git", rev = "39cb1a36a9e1e08b237362257b8db6e47e036fe6" }

[patch."https://github.com/doki-land/dejavu-engine.git"]
dejavu = { git = "https://github.com/notedge/dejavu-language.git", rev = "c14ad3f786feb30676d809999199a3c867a90cbf" }
dejavu-engine = { git = "https://github.com/notedge/dejavu-language.git", rev = "c14ad3f786feb30676d809999199a3c867a90cbf" }
dejavu-ir = { git = "https://github.com/notedge/dejavu-language.git", rev = "c14ad3f786feb30676d809999199a3c867a90cbf" }
dejavu-language = { git = "https://github.com/notedge/dejavu-language.git", rev = "c14ad3f786feb30676d809999199a3c867a90cbf" }
dejavu-runtime = { git = "https://github.com/notedge/dejavu-language.git", rev = "c14ad3f786feb30676d809999199a3c867a90cbf" }
dejavu-types = { git = "https://github.com/notedge/dejavu-language.git", rev = "c14ad3f786feb30676d809999199a3c867a90cbf" }

[workspace.metadata.release]
push = false
tag = false
